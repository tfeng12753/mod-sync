[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-forecasting-engine"
version = "0.1.0"
description = "Ingredient forecasts and forecast-informed substitution recommendations"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "statsforecast>=2,<3"]

[tool.setuptools.packages.find]
include = ["backend*"]
